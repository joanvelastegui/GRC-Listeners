name: Run Hourly Radio Monitor
on:
  schedule:
    - cron: '0 * * * *' # Every hour at minute 0
jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install jupyter nbconvert pandas requests pytz
    - name: Execute notebook
      run: jupyter nbconvert --to notebook --execute --inplace your_notebook_name.ipynb
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add radio_listeners_history.csv
        git commit -m "Update hourly database" || exit 0
        git push
